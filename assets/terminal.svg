<svg fill="none" viewBox="0 0 800 300" width="100%" height="300" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background-color: #0d131f;
          border: 1px solid #1e293b;
          border-radius: 12px;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, monospace;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
          color: #94a3b8;
        }
        .header-bar {
          background-color: #141d2e;
          padding: 10px 16px;
          border-bottom: 1px solid #1e293b;
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .dots {
          display: flex;
          gap: 8px;
          align-items: center;
        }
        .dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
        }
        .dot-red { background-color: #ef4444; }
        .dot-yellow { background-color: #f59e0b; }
        .dot-green { background-color: #10b981; }
        .title {
          color: #64748b;
          font-size: 12px;
          margin-left: 8px;
          font-family: monospace;
        }
        .badge {
          background: rgba(56, 189, 248, 0.1);
          border: 1px solid rgba(56, 189, 248, 0.3);
          color: #38bdf8;
          font-size: 10px;
          font-weight: 600;
          padding: 3px 8px;
          border-radius: 4px;
          font-family: monospace;
          display: flex;
          align-items: center;
          gap: 6px;
        }
        .pulse-dot {
          width: 6px;
          height: 6px;
          background-color: #10b981;
          border-radius: 50%;
        }
        .content {
          padding: 18px 22px;
          font-size: 13px;
          line-height: 1.6;
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
        .prompt-line {
          color: #38bdf8;
          display: flex;
          align-items: center;
          gap: 6px;
          font-weight: 500;
        }
        .arrow { color: #10b981; font-weight: bold; }
        .tilde { color: #a78bfa; }
        .command { color: #ffffff; font-weight: bold; }
        .details-box {
          margin: 8px 0 10px 14px;
          padding-left: 14px;
          border-left: 2px solid #1e293b;
        }
        .key { color: #64748b; font-weight: 600; }
        .val-name { color: #38bdf8; font-weight: bold; font-size: 14px; }
        .val-text { color: #e2e8f0; }
        .highlight { color: #38bdf8; font-weight: 600; }
        .val-focus { color: #f43f5e; font-weight: 600; }
        .val-status { color: #10b981; }
        .typing {
          color: #ffffff;
        }
        .cursor {
          display: inline-block;
          width: 8px;
          height: 14px;
          background-color: #38bdf8;
          vertical-align: middle;
          margin-left: 2px;
          animation: blink 0.8s infinite;
        }
        @keyframes blink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0; }
        }
      </style>
      <div class="container">
        <div class="header-bar">
          <div class="dots">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
            <span class="title">aditya@workstation: ~/adiityakr</span>
          </div>
          <div class="badge">
            <span class="pulse-dot"></span>
            ACTIVE BUILDER
          </div>
        </div>
        <div class="content">
          <div class="prompt-line">
            <span class="arrow">➜</span>
            <span class="tilde">~</span>
            <span class="command">whoami --details</span>
          </div>
          <div class="details-box">
            <div><span class="key">NAME:</span> <span class="val-name">Aditya Kumar</span></div>
            <div><span class="key">ROLE:</span> <span class="val-text">CSE AIML Student @ <span class="highlight">Newton School of Technology</span></span></div>
            <div><span class="key">FOCUS:</span> <span class="val-focus">[ Python, Robotics, AI/ML &amp; Edge Computing ]</span></div>
            <div><span class="key">STATUS:</span> <span class="val-status">⚡ Competing in hackathons &amp; relentlessly learning new technologies</span></div>
          </div>
          <div class="prompt-line">
            <span class="arrow">➜</span>
            <span class="tilde">~</span>
            <span class="typing">git push origin master</span>
            <span class="cursor"></span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
